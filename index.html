<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Loop Habits Clone</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #4caf50;
            --border-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        h1 { text-align: center; font-size: 22px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="text"] {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            background: var(--card-bg); color: var(--text-color); font-size: 16px;
        }
        button.add-btn {
            padding: 12px 18px; border-radius: 10px; border: none;
            background: var(--accent-color); color: #fff; font-weight: bold; font-size: 16px; cursor: pointer;
        }
        .habit-card {
            background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .habit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .habit-title { font-size: 17px; font-weight: bold; cursor: pointer; }
        .habit-score { font-size: 13px; color: var(--accent-color); font-weight: bold; }
        .days-grid { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
        .day-cell {
            min-width: 28px; height: 36px; border-radius: 6px; background: #2a2a2a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; color: var(--text-secondary); cursor: pointer; border: 1px solid transparent;
        }
        .day-cell.done { background: var(--accent-color); color: #fff; }
        .day-cell span { font-size: 12px; font-weight: bold; }
        .stats-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 8px; }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .modal-content { background: var(--card-bg); border-radius: 16px; padding: 20px; max-width: 400px; margin: 40px auto; position: relative; }
        .close-btn { float: left; font-size: 22px; cursor: pointer; color: var(--text-secondary); }
        .stats-box { background: #252525; border-radius: 10px; padding: 12px; margin: 10px 0; text-align: center; }
        .stats-box h3 { margin: 0 0 5px 0; font-size: 20px; color: var(--accent-color); }
        .stats-box p { margin: 0; font-size: 12px; color: var(--text-secondary); }
        .chart-container { margin-top: 15px; background: #161616; border-radius: 8px; padding: 10px; height: 100px; display: flex; align-items: flex-end; gap: 3px; }
        .chart-bar { flex: 1; background: var(--accent-color); border-radius: 2px 2px 0 0; min-height: 2px; }
    </style>
</head>
<body>

    <h1>Loop Habits (iOS Web)</h1>
    
    <div class="input-group">
        <input type="text" id="habitInput" placeholder="הרגל חדש (למשל: לקרוא ספר)...">
        <button class="add-btn" onclick="addHabit()">הוסף</button>
    </div>

    <div id="habitsList"></div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">שם ההרגל</h2>
            
            <div class="stats-box">
                <h3 id="modalScore">100%</h3>
                <p>ניקוד הרגל (Habit Score)</p>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <div class="stats-box" style="flex:1;">
                    <h3 id="modalCurrentStreak">0</h3>
                    <p>רצף נוכחי</p>
                </div>
                <div class="stats-box" style="flex:1;">
                    <h3 id="modalBestStreak">0</h3>
                    <p>רצף הכי טוב</p>
                </div>
            </div>

            <h4 style="margin: 15px 0 5px 0; font-size: 14px;">גרף מגמת ניקוד לאורך זמן</h4>
            <div class="chart-container" id="habitChart"></div>
            
            <button onclick="deleteCurrentHabit()" style="width:100%; margin-top:20px; padding:10px; background:#d32f2f; color:#fff; border:none; border-radius:8px; font-weight:bold;">מחק הרגל</button>
        </div>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('loop_clone_habits')) || [];
        let activeHabitId = null;

        function getFormattedDate(date) {
            return date.toISOString().split('T')[0];
        }

        function save() {
            localStorage.setItem('loop_clone_habits', JSON.stringify(habits));
            render();
            if(activeHabitId !== null) openModal(activeHabitId);
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const title = input.value.trim();
            if (!title) return;
            habits.push({ id: Date.now(), title: title, days: [] });
            input.value = '';
            save();
        }

        function toggleDay(id, dateStr) {
            const habit = habits.find(h => h.id === id);
            if (habit.days.includes(dateStr)) {
                habit.days = habit.days.filter(d => d !== dateStr);
            } else {
                habit.days.push(dateStr);
            }
            save();
        }

        function calculateStats(days) {
            let currentStreak = 0;
            let totalDaysChecked = days.length;
            
            let streakCount = 0;
            let c = new Date();
            while(true) {
                let ds = getFormattedDate(c);
                if(days.includes(ds)) {
                    streakCount++;
                    c.setDate(c.getDate() - 1);
                } else {
                    if(streakCount === 0 && getFormattedDate(new Date()) === ds) {
                        c.setDate(c.getDate() - 1);
                        let dsY = getFormattedDate(c);
                        if(days.includes(dsY)) {
                            streakCount++;
                            c.setDate(c.getDate() - 1);
                            continue;
                        }
                    }
                    break;
                }
            }
            currentStreak = streakCount;

            let score = 0;
            if(totalDaysChecked > 0) {
                score = Math.min(100, Math.round((totalDaysChecked / 30) * 100));
            }

            return { currentStreak, bestStreak: Math.max(currentStreak, totalDaysChecked > 0 ? currentStreak : 0), score };
        }

        function render() {
            const list = document.getElementById('habitsList');
            list.innerHTML = '';

            let last7Days = [];
            for(let i = 6; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                last7Days.push({ dateStr: getFormattedDate(d), label: ['א','ב','ג','ד','ה','ו','ש'][d.getDay()], dayNum: d.getDate() });
            }

            habits.forEach(h => {
                const stats = calculateStats(h.days);
                const card = document.createElement('div');
                card.className = 'habit-card';
                
                let daysHtml = '';
                last7Days.forEach(day => {
                    const isDone = h.days.includes(day.dateStr);
                    daysHtml += `
                        <div class="day-cell ${isDone ? 'done' : ''}" onclick="toggleDay(${h.id}, '${day.dateStr}')">
                            <small>${day.label}</small>
                            <span>${day.dayNum}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="habit-header">
                        <span class="habit-title" onclick="openModal(${h.id})">${h.title}</span>
                        <span class="habit-score">${stats.score}% ניקוד</span>
                    </div>
                    <div class="days-grid">${daysHtml}</div>
                    <div class="stats-row" onclick="openModal(${h.id})" style="cursor:pointer;">
                        <span>רצף נוכחי: <strong>${stats.currentStreak} ימים 🔥</strong></span>
                        <span>הצג סטטיסטיקות וגרפים ←</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function openModal(id) {
            activeHabitId = id;
            const habit = habits.find(h => h.id === id);
            if(!habit) return;

            const stats = calculateStats(habit.days);
            document.getElementById('modalTitle').innerText = habit.title;
            document.getElementById('modalScore').innerText = stats.score + '%';
            document.getElementById('modalCurrentStreak').innerText = stats.currentStreak;
            document.getElementById('modalBestStreak').innerText = stats.bestStreak;

            const chart = document.getElementById('habitChart');
            chart.innerHTML = '';
            for(let i = 15; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - (i * 2));
                let ds = getFormattedDate(d);
                let isDone = habit.days.includes(ds);
                
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                bar.style.height = isDone ? '100%' : '15%';
                bar.style.opacity = isDone ? '1' : '0.3';
                chart.appendChild(bar);
            }

            document.getElementById('detailModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
            activeHabitId = null;
        }

        function deleteCurrentHabit() {
            if(activeHabitId === null) return;
            if(confirm('האם למחוק את ההרגל?')) {
                habits = habits.filter(h => h.id !== activeHabitId);
                closeModal();
                save();
            }
        }

        render();
    </script>
</body>
</html>
